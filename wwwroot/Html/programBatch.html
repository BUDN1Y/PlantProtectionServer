<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/Html/Style.css" />
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <div>
        <!--Таблица-->
        <div style="border: 1px solid black; border-radius: 6px; padding: 5px; margin: 100px 100px">
            <!--Шапка-->
            <div style="display: grid; grid-template-columns: 1fr 0.5fr; border: 1px solid black">
                <div style="display: flex; gap: 10px;">
                    <label>Система производства СЗР</label>
                    <label>Раздел: Программа партии</label>
                </div>
                <div style="display: flex; gap: 10px">
                    <label>Online</label>
                    <label id="infoUser"></label>
                    <a href="/Html/Authorization.html">Выйти</a>
                </div>
            </div>

            <!--Основной контент-->
            <div style="display: grid; grid-template-columns: 0.4fr 1fr">
                <!--Сылки на другие страницы-->
                <div style="border: 1px solid black; display: flex; flex-direction: column; gap: 8px; padding: 10px">
                    <a href="/Html/main.html">Активные партий</a>
                    <a href="/Html/programBatch.html">Программа партии</a>
                    <a href="#"></a>
                    <a href="#"></a>
                    <a href="#"></a>
                </div>

                <!--Вторая колонка-->
                <div>
                    <!--Доп информация-->
                    <div style="display: flex; flex-direction: row; border: 1px solid black; border-radius: 6px; margin: 10px; padding: 10px; gap: 10px">
                        <div style="display: flex; flex-direction: column;">
                            <label>Номер партий</label>
                            <label id="numberBatch"></label>
                        </div>

                        <div style="display: flex; flex-direction: column;">
                            <label>Продукт</label>
                            <label id="productName"></label>
                        </div>

                        <div style="display: flex; flex-direction: column;">
                            <label>Статус партий</label>
                            <label id="statusBatch"></label>
                        </div>

                        <div style="display: flex; flex-direction: column;">
                            <label>Текущий шаг</label>
                            <label id="currentStep"></label>
                        </div>

                        <div style="display: flex; flex-direction: column;">
                            <label>Начало партий</label>
                            <label id="dateStart"></label>
                        </div>

                        <div style="display: flex; flex-direction: column;">
                            <label>Отклонения</label>
                            <label id="deviations"></label>
                        </div>
                    </div>

                    <!--Вторая колонка-->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; padding: 10px">
                        <div style="display: flex; flex-direction: column">
                            <label>Шаги партий</label>
                            <div id="step" style="display: flex; flex-direction: column; padding: 10px; border: 1px solid black; border-radius: 6px; gap: 10px;">

                            </div>
                        </div>

                        <div style="padding: 10px">
                            <!--Вверх 2 колонки-->
                            <div style="display: flex; flex-direction: row;">
                                <label id="column2Step"></label>
                                <label id="column2StatusName" style="margin: 0 0 0 auto"></label>
                            </div>

                            <!--Инструкция технолога-->
                            <div style="margin: 10px 0 0 0; display: flex; flex-direction: column;">
                                <label>Инструкция технолога</label>
                                <label style="margin: 10px 0 0 0" id="column2Instruction"></label>
                                <label id="mandatoryStep"></label>
                            </div>

                            <!--Параметра шага-->
                            <div style="padding: 20px; gap: 10px;">
                                <label>Параметры шага</label>
                                <div id="column2ParametrsStep">
                                </div>
                            </div>

                        </div>
                    </div>

                    <!--Пунк управления-->
                    <div style="padding: 20px">
                        <button id="startStep">Начать шаг</button>
                        <button id="endStep">Завершить шаг</button>
                        <label>Комментарий:</label>
                        <input id="comment" type="text"/>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const startStepButton = document.getElementById("startStep");
        const endStepButton = document.getElementById("endStep");
        const mandatoryStep = document.getElementById("mandatoryStep");
        const stepTable = document.getElementById("step");
        const column2Step = document.getElementById("column2Step");
        const column2StatusName = document.getElementById("column2StatusName");
        const column2Instruction = document.getElementById("column2Instruction");
        const column2ParametrsStep = document.getElementById("column2ParametrsStep");
        const numberBatch = document.getElementById("numberBatch");
        const productName = document.getElementById("productName");
        const statusBatch = document.getElementById("statusBatch");
        const currentStep = document.getElementById("currentStep");
        const dateStart = document.getElementById("dateStart");
        const deviations = document.getElementById("deviations");
        const comment = document.getElementById("comment");

        let batchSelected;
        let tehMapStepSelected;
        let allInfoProduction;


        startStepButton.addEventListener("click", StartBatch);
        endStepButton.addEventListener("click", endBatch);


        async function StartBatch() {
            techStepCurrent = allInfoProduction.batchStepExecutions.at(-1).techStepId;
            techStepCurrent += 1;
            const parametr = new URLSearchParams()
            parametr.set("batchSelected", batchSelected);
            parametr.set("tehMapStepSelected", techStepCurrent);

            if (comment.value !== undefined) parametr.set("comment", comment);
            
            await fetch(`/api/appMachineOperator/startBatch?${parametr}`, {
                method: "POST",
                headers: {
                    "Accept": "application/json"
                }
            });
        }

        async function endBatch() {
            const inputTemperatur = document.getElementById("inputTemperatura");
            const inputPressure = document.getElementById("inputPressure");
            const inputTime = document.getElementById("inputTime");
            
            let actualTemp;
            let actualTime;
            let actualPressure;

            if (inputTemperatur) {
                actualTemp = inputTemperatur.value.trim();
                if (actualTemp === "") {
                    alert("Температура: заполните поле");
                    inputTemperatur.focus();
                    return;
                }
                if (Number.isNaN(Number(actualTemp))) {
                    alert("Температура: введите число");
                    inputTemperatur.focus();
                    return;
                }
            }

            if (inputPressure) {
                actualPressure = inputPressure.value.trim();
                if (actualTime === "") {
                    alert("Давление: заполните поле");
                    inputPressure.focus();
                    return;
                }
                if (Number.isNaN(Number(actualPressure))) {
                    alert("Давление: введите число");
                    inputPressure.focus();
                    return;
                }
            }

            if (inputTime) {
                actualTime = inputTime.value.trim();
                if (inputTime === "") {
                    alert("Время: заполните поле");
                    inputTime.focus();
                    return;
                }
                if (Number.isNaN(Number(inputTime))) {
                    alert("Время: введите число");
                    inputTime.focus();
                    return;
                }
            }


            const params = new URLSearchParams();
            params.set("batchSelected", batchSelected);
            params.set("tehMapStepSelected", tehMapStepSelected);

            if (actualTemp !== undefined) params.set("actualTemp", actualTemp);
            if (actualTime !== undefined) params.set("actualTime", actualTime);
            if (actualPressure !== undefined) params.set("actualPressure", actualPressure);
     
            await fetch(`/api/appMachineOperator/endBatch?${params}`, {
                method: "PUT",
                headers: {
                    "Accept": "application/json"
                }
            });


        }

        
        window.addEventListener("DOMContentLoaded", () => {
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            batchSelected = JSON.parse(localStorage.getItem('batch') || 'null');
            if (user == null) {
                window.location.href = "/Html/Authorization.html";
                return;
            }

            document.getElementById("infoUser").textContent = `${user.fio}`;

            numberBatch.textContent = `${batchSelected.batchNumber}`;
            productName.textContent = `${batchSelected.productName}`;
            statusBatch.textContent = `${batchSelected.statusName}`;
            currentStep.textContent = `${batchSelected.currentStepName}`;
            dateStart.textContent = `${batchSelected.startDate}`;

            if (batchSelected.hasWarnings == true) {
                deviations.textContent = "Есть";
            }
            else {
                deviations.textContent = "-"
            }

            LoadeTable();
        })

        async function LoadeTable() {
            const batchId = batchSelected.id;
            const batchTechMapId = batchSelected.techMapId;
            const urlParametr = new URLSearchParams({ batchId, batchTechMapId });

            const response = await fetch(`/api/appMachineOperator/programBetch?${urlParametr}`, {
                method: "GET",
                headers:
                {
                    "Accept": "application/json"
                }
            });

            const result = await response.json();
            allInfoProduction = result;
            let batcStep = allInfoProduction.batchStepExecutions;

            for (let i = 0; i < allInfoProduction.batchStepExecutions.length; i++) {
                const divStep = document.createElement("div");

                divStep.classList.add("cardParametr");


                const labelStepNumber = document.createElement("label");
                labelStepNumber.textContent = `Шаг номер: ${i + 1}`;

                divStep.append(labelStepNumber);

                const labelComment = document.createElement("label");
                labelComment.textContent = batcStep[i].comment;

                divStep.append(labelComment);

                const labelStatus = document.createElement("label");
                labelStatus.textContent = batcStep[i].statusName;

                const buttonEntry = document.createElement("button");
                buttonEntry.type = "button";
                buttonEntry.textContent = "Перейти в шаг";
                buttonEntry.addEventListener("click", () => FillColumn2(i, i + 1))


                divStep.append(labelStatus);

                divStep.append(buttonEntry);


                stepTable.append(divStep);
            }
            let a = allInfoProduction.batchStepExecutions.length - 1;
            console.log(allInfoProduction.batchStepExecutions);
            console.log(allInfoProduction.techMapSteps)
            FillColumn2(allInfoProduction.batchStepExecutions.length - 1, allInfoProduction.techMapSteps.find(x => x.id == allInfoProduction.batchStepExecutions[a].techStepId).stepNumber);
        }

        function FillColumn2(batchStepIndex, techMapStepsIndex) {
            batchSelected = allInfoProduction.batchStepExecutions[batchStepIndex].batchId;
            tehMapStepSelected = techMapStepsIndex;

            console.log(batchSelected);
            console.log(tehMapStepSelected);

            column2ParametrsStep.innerHTML = "";

            let isTemperature = false;
            let isPersure = false;
            let isTime = false;

            column2Step.textContent = `Шаг ${batchStepIndex + 1}: ${allInfoProduction.techMapSteps[batchStepIndex].name}`;
            column2StatusName.textContent = `${allInfoProduction.batchStepExecutions[batchStepIndex].statusName}`;

            //Инструкция
            column2Instruction.classList.add("cardParametr");
            column2Instruction.textContent = `${allInfoProduction.techMapSteps[batchStepIndex].instruction}`;

            let isMandatory = allInfoProduction.techMapSteps[batchStepIndex].isMandatory;
            let MandatoryText = isMandatory ? "Шаг Обязательный" : "Шаг не обязательный";


            //Обязательный шаг
            mandatoryStep.textContent = MandatoryText;


            //Параметры шага


            //Температура
            const divTemperature = document.createElement("div");
            divTemperature.classList.add("cardParametr");

            const labelHowTemperature = document.createElement("label");
            labelHowTemperature.textContent = "Температура";

            const labelStandardTemperature = document.createElement("label");
            if (allInfoProduction.techMapSteps[batchStepIndex].plannedTemp == null) {
                labelStandardTemperature.textContent = "Отсутствует";
            }
            else {
                isTemperature = true;
                labelStandardTemperature.textContent = `Норма: ${allInfoProduction.techMapSteps[batchStepIndex].toleranceTempMin} - ${allInfoProduction.techMapSteps[batchStepIndex].toleranceTempMax}`;
            }



            divTemperature.append(labelHowTemperature);
            divTemperature.append(labelStandardTemperature);

            if (isTemperature) {
                const inputDataTemperature = document.createElement("input");
                inputDataTemperature.type = "text";
                inputDataTemperature.id = "inputTemperatura";
                divTemperature.append(inputDataTemperature);
            }

            column2ParametrsStep.append(divTemperature);

            //Давление
            const divPressure = document.createElement("div");
            divPressure.classList.add("cardParametr");

            const lavelHowPressure = document.createElement("label");
            lavelHowPressure.textContent = "Давление";

            const labelStandardPressure = document.createElement("label");
            if (allInfoProduction.techMapSteps[batchStepIndex].plannedPressure == null) {
                labelStandardPressure.textContent = "Отсутствует";
            }
            else {
                isPersure = true;
                labelStandardPressure.textContent = `Норма: ${allInfoProduction.techMapSteps[batchStepIndex].tolerancePressureMin} - ${allInfoProduction.techMapSteps[batchStepIndex].tolerancePressureMax}`;
            }

            divPressure.append(lavelHowPressure);
            divPressure.append(labelStandardPressure);

            if (isPersure) {
                const inputDataPressure = document.createElement("input");
                inputDataPressure.type = "text";
                inputDataPressure.id = "inputPressure";
                divPressure.append(inputDataPressure);
            }

            column2ParametrsStep.append(divPressure);

            //Время работы

            const divTime = document.createElement("div");
            divTime.classList.add("cardParametr");

            const lavelHowTime = document.createElement("label");
            lavelHowTime.textContent = `Время работы ${allInfoProduction.techMapSteps[batchStepIndex].name}`

            const labelStandardTime = document.createElement("label");
            if (allInfoProduction.techMapSteps[batchStepIndex].plannedPressure == null) {
                labelStandardTime.textContent = "Отсутствует";
            }
            else {
                isTime = true;
                labelStandardTime.textContent = `Норма: ${allInfoProduction.techMapSteps[batchStepIndex].plannedTimeMin} - ${allInfoProduction.techMapSteps[batchStepIndex].plannedTimeMax}`;
            }

            divTime.append(lavelHowTime);
            divTime.append(labelStandardTime);

            if (isTime) {
                const inputDataTime = document.createElement("input");
                inputDataTime.type = "text";
                inputDataTime.id = "inputTime";
                divTime.append(inputDataTime);
            }

            column2ParametrsStep.append(divTime);
        }





    </script>
</body>
</html>
