<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/Html/Style.css" />
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <div>
        <!--Таблица-->
        <div style="border: 1px solid black; border-radius: 6px; padding: 5px; margin: 100px 100px">
            <!--Шапка-->
            <div style="display: grid; grid-template-columns: 1fr 0.5fr; border: 1px solid black">
                <div style="display: flex; gap: 10px;">
                    <label>Система производства СЗР</label>
                    <label>Раздел: Программа партии</label>
                </div>
                <div style="display: flex; gap: 10px">
                    <label>Online</label>
                    <label id="infoUser"></label>
                    <a href="/Html/Authorization.html">Выйти</a>
                </div>
            </div>

            <!--Основной контент-->
            <div style="display: grid; grid-template-columns: 0.4fr 1fr">
                <!--Сылки на другие страницы-->
                <div style="border: 1px solid black; display: flex; flex-direction: column; gap: 8px; padding: 10px">
                    <a href="/Html/main.html">Активные партий</a>
                    <a href="/Html/programBatch.html">Программа партии</a>
                    <a href="#"></a>
                    <a href="#"></a>
                    <a href="#"></a>
                </div>

                <!--Вторая колонка-->
                <div>
                    <!--Доп информация-->
                    <div style="display: flex; flex-direction: row; border: 1px solid black; border-radius: 6px; margin: 10px; padding: 10px; gap: 10px">
                        <div style="display: flex; flex-direction: column;">
                            <label>Номер партий</label>
                            <label id="numberBatch"></label>
                        </div>

                        <div style="display: flex; flex-direction: column;">
                            <label>Продукт</label>
                            <label id="productName"></label>
                        </div>

                        <div style="display: flex; flex-direction: column;">
                            <label>Статус партий</label>
                            <label id="statusBatch"></label>
                        </div>

                        <div style="display: flex; flex-direction: column;">
                            <label>Текущий шаг</label>
                            <label id="currentStep"></label>
                        </div>

                        <div style="display: flex; flex-direction: column;">
                            <label>Начало партий</label>
                            <label id="dateStart"></label>
                        </div>

                        <div style="display: flex; flex-direction: column;">
                            <label>Отклонения</label>
                            <label id="deviations"></label>
                        </div>
                    </div>

                    <!--Вторая колонка-->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; padding: 10px">
                        <div style="display: flex; flex-direction: column">
                            <label>Шаги партий</label>
                            <div id="step" style="display: flex; flex-direction: column; padding: 10px; border: 1px solid black; border-radius: 6px; gap: 10px;">

                            </div>
                        </div>

                        <div style="padding: 10px">
                            <!--Вверх 2 колонки-->
                            <div style="display: flex; flex-direction: row;">
                                <label id="column2Step"></label>
                                <label id="column2StatusName" style="margin: 0 0 0 auto"></label>
                            </div>

                            <!--Инструкция технолога-->
                            <div style="margin: 10px 0 0 0; display: flex; flex-direction: column;">
                                <label>Инструкция технолога</label>
                                <label style="margin: 10px 0 0 0" id="column2Instruction"></label>
                                <label id="mandatoryStep"></label>
                            </div>

                            <!--Параметра шага-->
                            <div style="padding: 20px; gap: 10px;">
                                <label>Параметры шага</label>
                                <div id="column2ParametrsStep">
                                </div>
                            </div>

                        </div>
                    </div>

                    <!--Пунк управления-->
                    <div style="padding: 20px">
                        <button id="startStep">Начать шаг</button>
                        <button id="endStep">Завершить шаг</button>
                        <label>Комментарий:</label>
                        <input id="comment" type="text" />
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const startStepButton = document.getElementById("startStep");
        const endStepButton = document.getElementById("endStep");
        const mandatoryStep = document.getElementById("mandatoryStep");
        const stepTable = document.getElementById("step");
        const column2Step = document.getElementById("column2Step");
        const column2StatusName = document.getElementById("column2StatusName");
        const column2Instruction = document.getElementById("column2Instruction");
        const column2ParametrsStep = document.getElementById("column2ParametrsStep");
        const numberBatch = document.getElementById("numberBatch");
        const productName = document.getElementById("productName");
        const statusBatch = document.getElementById("statusBatch");
        const currentStep = document.getElementById("currentStep");
        const dateStart = document.getElementById("dateStart");
        const deviations = document.getElementById("deviations");
        const comment = document.getElementById("comment");

        let batchSelected;       
        let batchId;               
        let techStepIdSelected;    
        let allInfoProduction;

        startStepButton.addEventListener("click", StartBatch);
        endStepButton.addEventListener("click", endBatch);


        function findTechStepByExec(exec) {
            return allInfoProduction.techMapSteps.find(s => s.stepNumber === exec.techStepId);
        }

        async function StartBatch() {
            if (!allInfoProduction) { alert("Данные ещё не загружены"); return; }

            const executions = allInfoProduction.batchStepExecutions || [];
            const techSteps = allInfoProduction.techMapSteps || [];

            let nextStep = null;

            if (executions.length === 0) {
                nextStep = [...techSteps].sort((a, b) => a.stepNumber - b.stepNumber)[0];
            } else {
                const lastExec = executions[executions.length - 1];
                const lastTechStep = findTechStepByExec(lastExec);
                if (!lastTechStep) { alert("Не найден текущий шаг"); return; }
                nextStep = techSteps.find(s => s.stepNumber === lastTechStep.stepNumber + 1);
            }

            if (!nextStep) { alert("Все шаги выполнены"); return; }

            const params = new URLSearchParams();
            params.set("batchSelected", batchId);
            params.set("tehMapStepSelected", nextStep.stepNumber); 
            params.set("comment", comment.value ?? "");

            const resp = await fetch(`/api/appMachineOperator/startBatch?${params}`, {
                method: "POST",
                headers: { "Accept": "application/json" }
            });

            if (!resp.ok) { alert("Ошибка запуска: " + resp.status); return; }
            location.reload();
        }

        async function endBatch() {
            const inputTemperatur = document.getElementById("inputTemperatura");
            const inputPressure = document.getElementById("inputPressure");
            const inputTime = document.getElementById("inputTime");

            let actualTemp, actualPressure, actualTime;

            if (inputTemperatur) {
                actualTemp = inputTemperatur.value.trim();
                if (actualTemp === "") { alert("Температура: заполните поле"); inputTemperatur.focus(); return; }
                if (!Number.isFinite(Number(actualTemp))) { alert("Температура: введите число"); inputTemperatur.focus(); return; }
            }
            if (inputPressure) {
                actualPressure = inputPressure.value.trim();
                if (actualPressure === "") { alert("Давление: заполните поле"); inputPressure.focus(); return; }
                if (!Number.isFinite(Number(actualPressure))) { alert("Давление: введите число"); inputPressure.focus(); return; }
            }
            if (inputTime) {
                actualTime = inputTime.value.trim();
                if (actualTime === "") { alert("Время: заполните поле"); inputTime.focus(); return; }
                if (!Number.isFinite(Number(actualTime))) { alert("Время: введите число"); inputTime.focus(); return; }
            }

            if (!techStepIdSelected) { alert("Шаг не выбран"); return; }

            const params = new URLSearchParams();
            params.set("batchSelected", batchId);
            params.set("tehMapStepSelected", techStepIdSelected); // это stepNumber

            if (actualTemp !== undefined) params.set("actualTemp", actualTemp);
            if (actualTime !== undefined) params.set("actualTime", actualTime);
            if (actualPressure !== undefined) params.set("actualPressure", actualPressure);

            const resp = await fetch(`/api/appMachineOperator/endBatch?${params}`, {
                method: "PUT",
                headers: { "Accept": "application/json" }
            });

            if (!resp.ok) { alert("Ошибка завершения: " + resp.status); return; }
            location.reload();
        }

        window.addEventListener("DOMContentLoaded", () => {
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            batchSelected = JSON.parse(localStorage.getItem('batch') || 'null');

            if (!user) { window.location.href = "/Html/Authorization.html"; return; }
            if (!batchSelected) { alert("Партия не выбрана"); window.location.href = "/Html/main.html"; return; }

            batchId = batchSelected.id;

            document.getElementById("infoUser").textContent = user.fio;
            numberBatch.textContent = batchSelected.batchNumber ?? "-";
            productName.textContent = batchSelected.productName ?? "-";
            statusBatch.textContent = batchSelected.statusName ?? "-";
            currentStep.textContent = batchSelected.currentStepName ?? "-";
            dateStart.textContent = batchSelected.startDate ?? "-";
            deviations.textContent = batchSelected.hasWarnings ? "Есть" : "-";

            LoadeTable();
        });

        async function LoadeTable() {
            const urlParametr = new URLSearchParams({
                batchId: batchId,
                batchTechMapId: batchSelected.techMapId
            });

            const response = await fetch(`/api/appMachineOperator/programBetch?${urlParametr}`, {
                method: "GET",
                headers: { "Accept": "application/json" }
            });

            if (!response.ok) { alert("Не удалось загрузить данные"); return; }

            allInfoProduction = await response.json();
            RefreshColumn2();
        }

        function RefreshColumn2() {
            stepTable.innerHTML = "";
            const executions = allInfoProduction.batchStepExecutions || [];

            for (let i = 0; i < executions.length; i++) {
                const exec = executions[i];
                const techStep = findTechStepByExec(exec);

                const divStep = document.createElement("div");
                divStep.classList.add("cardParametr");

                const l1 = document.createElement("label");
                l1.textContent = `Шаг номер: ${techStep?.stepNumber ?? "?"}`;
                divStep.append(l1);

                const l2 = document.createElement("label");
                l2.textContent = exec.comment ?? "";
                divStep.append(l2);

                const l3 = document.createElement("label");
                l3.textContent = exec.statusName ?? "";
                divStep.append(l3);

                const btn = document.createElement("button");
                btn.type = "button";
                btn.textContent = "Перейти в шаг";
                btn.addEventListener("click", () => FillColumn2(i));
                divStep.append(btn);

                stepTable.append(divStep);
            }

            if (executions.length > 0) {
                FillColumn2(executions.length - 1);
            } else if ((allInfoProduction.techMapSteps || []).length > 0) {
                const first = [...allInfoProduction.techMapSteps]
                    .sort((a, b) => a.stepNumber - b.stepNumber)[0];
                FillColumn2ByTechStep(first, null);
            }
        }

        function FillColumn2(index) {
            const exec = allInfoProduction.batchStepExecutions[index];
            const techStep = findTechStepByExec(exec);
            if (!techStep) { alert("Шаг не найден в карте"); return; }
            FillColumn2ByTechStep(techStep, exec);
        }

        function FillColumn2ByTechStep(techStep, exec) {
            techStepIdSelected = techStep.stepNumber;

            column2ParametrsStep.innerHTML = "";

            column2Step.textContent = `Шаг ${techStep.stepNumber}: ${techStep.name}`;
            column2StatusName.textContent = exec?.statusName ?? "Не начат";

            column2Instruction.classList.add("cardParametr");
            column2Instruction.textContent = techStep.instruction ?? "";

            mandatoryStep.textContent = techStep.isMandatory
                ? "Шаг обязательный" : "Шаг не обязательный";

            // Температура
            {
                const div = document.createElement("div");
                div.classList.add("cardParametr");

                const title = document.createElement("label");
                title.textContent = "Температура";
                div.append(title);

                const norm = document.createElement("label");
                if (techStep.plannedTemp == null) {
                    norm.textContent = "Отсутствует";
                } else {
                    norm.textContent = `Норма: ${techStep.toleranceTempMin ?? "-"} - ${techStep.toleranceTempMax ?? "-"}`;
                    const inp = document.createElement("input");
                    inp.type = "text";
                    inp.id = "inputTemperatura";
                    div.append(norm, inp);
                    column2ParametrsStep.append(div);
                    return_skip_temp = true;
                }
                if (techStep.plannedTemp == null) {
                    div.append(norm);
                }
                column2ParametrsStep.append(div);
            }

            // Давление
            {
                const div = document.createElement("div");
                div.classList.add("cardParametr");

                const title = document.createElement("label");
                title.textContent = "Давление";
                div.append(title);

                const norm = document.createElement("label");
                if (techStep.plannedPressure == null) {
                    norm.textContent = "Отсутствует";
                    div.append(norm);
                } else {
                    norm.textContent = `Норма: ${techStep.tolerancePressureMin ?? "-"} - ${techStep.tolerancePressureMax ?? "-"}`;
                    const inp = document.createElement("input");
                    inp.type = "text";
                    inp.id = "inputPressure";
                    div.append(norm, inp);
                }
                column2ParametrsStep.append(div);
            }

            // Время
            {
                const div = document.createElement("div");
                div.classList.add("cardParametr");

                const title = document.createElement("label");
                title.textContent = `Время работы ${techStep.name}`;
                div.append(title);

                const norm = document.createElement("label");
                if (techStep.plannedTimeMin == null && techStep.plannedTimeMax == null) {
                    norm.textContent = "Отсутствует";
                    div.append(norm);
                } else {
                    norm.textContent = `Норма: ${techStep.plannedTimeMin ?? "-"} - ${techStep.plannedTimeMax ?? "-"}`;
                    const inp = document.createElement("input");
                    inp.type = "text";
                    inp.id = "inputTime";
                    div.append(norm, inp);
                }
                column2ParametrsStep.append(div);
            }
        }
    </script>
</body>
</html>
