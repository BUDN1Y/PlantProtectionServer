<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>

    <div>
        <!--Таблица-->
        <div style="border: 1px solid black; border-radius: 6px; padding: 5px; margin: 100px 100px">
            <!--Шапка-->
            <div style="display: grid; grid-template-columns: 1fr 0.5fr; border: 1px solid black">
                <div style="display: flex; gap: 10px;">
                    <label>Система производства СЗР</label>
                    <label>Раздел: Активные партий</label>
                </div>
                <div style="display: flex; gap: 10px">
                    <label>Online</label>
                    <label id="infoUser"></label>
                    <a href="/Html/Authorization.html">Выйти</a>
                </div>
            </div>

            <!--Основной контент-->
            <div style="display: grid; grid-template-columns: 0.4fr 1fr">
                <!--Сылки на другие страницы-->
                <div style="border: 1px solid black; display: flex; flex-direction: column; gap: 8px; padding: 10px">
                    <a href="/Html/main.html">Активные партий</a>
                    <a href="#">Программа партии</a>
                    <a href="#"></a>
                    <a href="#"></a>
                    <a href="#"></a>
                </div>

                <!--Вторая колонка-->
                <div>
                    <!--Фильтрация-->
                    <div style="display: flex; flex-direction: row; border: 1px solid black; border-radius: 6px; margin: 10px; padding: 10px; gap: 10px">
                        <label>Поиск:</label>
                        <input type="text" id="searchBatchOrProduct" />

                        <label>Статус:</label>
                        <select id="filterStatus">
                            <option value="0">Все</option>
                            <option value="1">Запланирована</option>
                            <option value="2">Запущена</option>
                            <option value="3">В процессе</option>
                            <option value="4">Приостановлена</option>
                            <option value="5">Завершена</option>
                            <option value="6">Заблокирована</option>
                            <option value="7">Отменена</option>
                        </select>
                    </div>

                    <table id="tableInfo" border="1" style="">
                        <thead>
                            <tr>
                                <th>№ партии</th>
                                <th>Продукт</th>
                                <th>Текущий шаг</th>
                                <th>Статус партии</th>
                                <th>Статус шага</th>
                                <th>Предупр</th>
                                <th>Крит. откл.</th>
                            </tr>
                        </thead>
                        <tbody id="tableInfoBody"></tbody>
                    </table>

                </div>
            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById("searchBatchOrProduct");
        const filterStatus = document.getElementById("filterStatus");
        const dataGrid = document.getElementById("tableInfoBody");
        let dataTable = [];
        let dataTableBufer = [];
        let textInputed = "";
        let statusBatchSelected = "Все";

        window.addEventListener("DOMContentLoaded", () => {
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            if (user == null) {
                window.location.href = "/Html/Authorization.html";
                return;
            }

            document.getElementById("infoUser").textContent = `${user.fio}`;
            LoadeTable();
        })

        filterStatus.addEventListener("change", FilterStatus);
        searchInput.addEventListener("input", FilterSearch);

        function FilterStatus(event) {
            const select = event.target;
            statusBatchSelected = select.options[select.selectedIndex].text;
            Filter();
        }

        function FilterSearch(event) {
            textInputed = event.target.value;
            Filter();
        }

        function Filter() {
            dataTableBufer = dataTable;

            if (textInputed != "") {
                dataTableBufer = dataTableBufer.filter(x => x.batchNumber.includes(textInputed) || x.productName.includes(textInputed))
                dataGrid.innerHTML = "";

                for (let i = 0; i < dataTableBufer.length; i++) {
                    dataGrid.append(AddDataActualBetch(dataTableBufer[i]));
                }
            }

            if (statusBatchSelected != "Все") {
                dataTableBufer = dataTableBufer.filter(x => x.statusName.includes(statusBatchSelected));
                dataGrid.innerHTML = "";

                for (let i = 0; i < dataTableBufer.length; i++) {
                    dataGrid.append(AddDataActualBetch(dataTableBufer[i]));
                }
            }
            
            if (statusBatchSelected == "Все" && textInputed == "") {
                dataGrid.innerHTML = "";
                for (let i = 0; i < dataTable.length; i++) {
                    dataGrid.append(AddDataActualBetch(dataTable[i]));
                }
            }
        }
     

        async function LoadeTable() {
            const response = await fetch("/api/appMachineOperator/actualBetchTable", {
                method: "GET",
                headers:
                {
                    "Accept": "application/json"
                }
            });

            dataTable = await response.json();

            for (let i = 0; i < dataTable.length; i++) {
                dataGrid.append(AddDataActualBetch(dataTable[i]));
            }
        }

        function AddDataActualBetch(data) {
            const tr = document.createElement("tr");

            const batchNumber = document.createElement("td");
            batchNumber.textContent = data.batchNumber;
            tr.append(batchNumber);

            const productName = document.createElement("td");
            productName.textContent = data.productName;
            tr.append(productName);

            const currentStepName = document.createElement("td");
            currentStepName.textContent = data.currentStepName;
            tr.append(currentStepName);

            const statusName = document.createElement("td");
            statusName.textContent = data.statusName;
            tr.append(statusName);

            const currentStepStatusName = document.createElement("td");
            currentStepStatusName.textContent = data.currentStepStatusName;
            tr.append(currentStepStatusName);


            const hasWarnings = document.createElement("td");
            if (data.hasWarnings) {
                hasWarnings.textContent = "+";
            }
            else {
                hasWarnings.textContent = "-";
            }
            tr.append(hasWarnings);

            const hasCriticals = document.createElement("td");
            if (data.hasCriticals) {
                hasCriticals.textContent = "+";
            }
            else {
                hasCriticals.textContent = "-";
            }
            tr.append(hasCriticals);

            const td = document.createElement("td");
            const buttonEntry = document.createElement("button");

            buttonEntry.textContent = "Перейти";
            buttonEntry.addEventListener("click", () => Entry_Click(data.id));

            td.append(buttonEntry);
            tr.append(td);
          
     
            return tr;

        }

        function Entry_Click(id) {
            localStorage.setItem('batch', JSON.stringify(dataTable.find(x => x.id == id)));
            window.location.href = "/Html/programBatch.html";
        }


    </script>
</body>
</html>
