<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <div style="border: 1px solid black; border-radius: 6px;
         padding: 10px; margin: 0 auto;
         width: 400px">

        <h1 style="display: flex; justify-content:center">Вход</h1>

        <div style="display:grid; grid-template-columns: 1fr 1fr">

            <label>Логин</label>
            <input type="text" style="font-size: 20px" id="log" />


            <label style="margin: 10px 0 0 0">Пароль</label>
            <input type="text" style="font-size: 20px; margin: 10px 0 0 0" id="pass" />
        </div>
        <a href="/Html/index.html">Перейти на главную страницу</a>
        <button type="button" id="entry">Войти</button>
    </div>

    <script>
        const btnEtry = document.getElementById("entry");
        btnEtry.addEventListener("click", Entry_Click);

        async function Entry_Click() {
            const log = document.getElementById("log").value;
            const pass = document.getElementById("pass").value;
            const urlParametr = new URLSearchParams({ log, pass });
            const response = await fetch(`/api/appMachineOperator/authorization?${urlParametr}`,
                {
                    method: "GET",
                    headers:
                    {
                        "Accept": "application/json"
                    }
                });

            if (!response.ok) {
                alert("Неверный логин или пароль");
            }
            else {
                const user = await response.json();
                if (user.roleId != 2) {
                    alert("У вас другая роль!");
                }
                else {
                    localStorage.setItem('user', JSON.stringify(user));
                    window.location.href = "/Html/main.html";
                }
            }
        }
    </script>
</body>
</html>
